name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare static bundle (public data snapshot + uploads)
        run: |
          mkdir -p public/data public/uploads
          cp data/settings.json data/articles.json data/ads.json data/partners.json public/data/ || true
          cp uploads/* public/uploads/ || true
          touch public/.nojekyll
          test -f public/index.html
          test -f public/js/main.js
          test -f public/css/style.css
          test -f public/data/articles.json
          ls public | head -30

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
